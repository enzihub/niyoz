<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Inter";src:url(../../docs/fonts/inter-var.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Instrument Serif";src:url(../../docs/fonts/instrument-serif-400.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(../../docs/fonts/instrument-serif-400-italic.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:Inter,sans-serif;color:#0B2545;-webkit-font-smoothing:antialiased}
.card{position:relative;overflow:hidden;border-radius:28px;background:#EAF7FF;
 background-image:radial-gradient(900px 500px at 85% 10%,rgba(0,89,255,.16),transparent 60%),radial-gradient(700px 420px at 0% 100%,rgba(255,214,102,.28),transparent 60%);}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:26px;letter-spacing:-.02em;color:#0D4785}
.brand img{width:34px;height:auto}
.serif{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.01em}
.shot{border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(11,37,69,.06),0 24px 60px -18px rgba(11,37,69,.35);border:1px solid rgba(11,37,69,.08)}
.shot .bar{height:26px;background:#F3F6FA;border-bottom:1px solid #E3E9F1;display:flex;align-items:center;gap:6px;padding:0 12px}
.shot .bar i{width:9px;height:9px;border-radius:50%;background:#D5DDE7;display:block}
.shot img{display:block;width:100%}

.card{width:1000px;height:520px;padding:52px 56px}
.copy{width:430px}
h1{font-size:62px;line-height:1.0;margin:34px 0 18px;color:#0B2545}
h1 em{font-style:italic;color:#0059FF}
p.sub{font-size:17.5px;line-height:1.55;color:#33506F;max-width:410px}
.chips{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.chips span{font-size:12.5px;font-weight:600;color:#0D4785;background:rgba(255,255,255,.75);border:1px solid rgba(13,71,133,.14);padding:6px 11px;border-radius:999px}
.right{position:absolute;right:40px;top:58px;width:440px;transform:rotate(-2deg)}
.right2{position:absolute;right:300px;bottom:-70px;width:270px;transform:rotate(3deg)}
.tag{position:absolute;right:36px;bottom:24px;font-size:12.5px;font-weight:600;color:#0D4785;background:#fff;box-shadow:0 6px 18px -8px rgba(11,37,69,.4);padding:7px 11px;border-radius:9px}
</style></head><body>
<div class="card">
 <div class="copy">
  <div class="brand"><img src="../../docs/img/niyoz-mark.png">niyoz</div>
  <h1 class="serif">Your YouTube homepage, <em>read</em> in five minutes.</h1>
  <p class="sub">Niyoz summarizes the videos YouTube recommends to you and emails you one tidy digest at the hour you pick.</p>
  <div class="chips"><span>FastAPI + Celery</span><span>Next.js 14</span><span>OpenAI summaries</span><span>MIT</span></div>
 </div>
 <div class="right shot"><div class="bar"><i></i><i></i><i></i></div><img src="../../docs/img/email.png"></div>
 <div class="tag">Real app · demo videos are invented</div>
</div></body></html>
